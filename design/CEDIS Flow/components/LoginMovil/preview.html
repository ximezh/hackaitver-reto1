<!-- @dsCard group="Acceso" height=860 subtitle="Android · CEDIS" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login móvil</title>
<style>
.hero{height:250px;background:linear-gradient(180deg,var(--brand-50),var(--surface-50));display:grid;place-items:center;position:relative}
.hero img{width:230px;height:200px;object-fit:contain}
.form{padding:4px 22px 0;display:flex;flex-direction:column;gap:12px}
.role{height:34px;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-4px);transition:.2s}
.role.show{opacity:1;transform:none}
.demo{display:flex;gap:8px;justify-content:center;margin-top:6px}
.demo button{border:1px solid var(--line);background:var(--surface-0);border-radius:14px;width:96px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--ink-muted)}
.demo button:hover{border-color:var(--brand-600);color:var(--brand-700)}
.welcome{position:absolute;inset:0;background:var(--surface-0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;transition:.3s;z-index:10;padding:24px;text-align:center}
.welcome.show{opacity:1;pointer-events:auto}
.welcome .badge{width:84px;height:84px;border-radius:26px;background:var(--brand-600);color:#fff;display:grid;place-items:center;animation:pop .4s}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:14px}
.mods div{border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink)}
.mods div span{color:var(--brand-600)}
</style></head>
<body>
<div class="stage"><div class="phone"><div class="screen" id="scr">
  <div id="sb"></div>
  <div class="hero"><img id="heroImg" alt="Ilustración de acceso"></div>
  <div class="form">
    <div><div class="t-display">Inicia sesión</div><div class="muted">CEDIS Flow · operación</div></div>
    <label class="field"><span id="iU"></span><input id="u" placeholder="Usuario" autocomplete="off" aria-label="Usuario"></label>
    <label class="field"><span id="iL"></span><input id="p" type="password" placeholder="Contraseña" aria-label="Contraseña"><button class="iconbtn ghost" id="eye" type="button" aria-label="Mostrar contraseña"></button></label>
    <div class="role" id="role"></div>
    <button class="btn primary block" id="go">Entrar</button>
    <div class="t-cap" style="text-align:center;margin-top:4px">Probar como</div>
    <div class="demo" id="demo"></div>
  </div>
  <div class="welcome" id="wel"></div>
</div></div></div>
<script>
(function(){
  var C=window.Cedis, $=function(id){return document.getElementById(id)};
  $('sb').innerHTML=C.statusBar(); $('heroImg').src=C.A.login;
  $('iU').innerHTML=C.ic('user'); $('iL').innerHTML=C.ic('lock'); $('eye').innerHTML=C.ic('eye');
  var roles={
    caseta:{n:'Caseta',i:'clock',u:'caseta.jlopez',m:[['login','Check-in'],['exit','Check-out'],['calendar','Citas']]},
    desembarque:{n:'Sup. desembarque',s:'Desembarque',i:'scan',u:'desem.mruiz',m:[['scan','Escanear'],['box','Bultos'],['pallet','Tarima 3D']]},
    embarque:{n:'Sup. embarque',s:'Embarque',i:'truck',u:'embar.acruz',m:[['truck','Camiones'],['pallet','Tarimas'],['printer','Relación']]}
  };
  function detect(v){v=v.toLowerCase(); if(v.indexOf('cas')===0)return 'caseta'; if(v.indexOf('des')===0)return 'desembarque'; if(v.indexOf('emb')===0)return 'embarque'; return null;}
  function showRole(){var r=detect($('u').value),el=$('role'); if(!r){el.classList.remove('show');return;}
    el.innerHTML='<span class="chip">'+C.ic(roles[r].i,14,2)+roles[r].n+'</span><span class="t-cap">CEDIS Veracruz</span>'; el.classList.add('show');}
  $('u').addEventListener('input',showRole);
  $('eye').onclick=function(){var p=$('p');p.type=p.type==='password'?'text':'password';};
  $('demo').innerHTML=Object.keys(roles).map(function(k){return '<button data-k="'+k+'">'+C.ic(roles[k].i,22)+(roles[k].s||roles[k].n)+'</button>'}).join('');
  $('demo').onclick=function(e){var b=e.target.closest('button');if(!b)return;var r=roles[b.dataset.k];$('u').value=r.u;$('p').value='••••••••';showRole();};
  $('go').onclick=function(){var r=detect($('u').value);
    if(!r||!$('p').value){C.toast($('scr'),'Revisa usuario y contraseña','alert');return;}
    var R=roles[r];
    $('wel').innerHTML='<div class="badge">'+C.ic(R.i,40)+'</div><div class="t-title">Bienvenido</div><span class="chip">'+R.n+'</span>'+
      '<div class="mods">'+R.m.map(function(m){return '<div><span>'+C.ic(m[0],26)+'</span>'+m[1]+'</div>'}).join('')+'</div>'+
      '<button class="btn line" style="margin-top:18px" id="back">'+C.ic('logout',18)+'Salir</button>';
    $('wel').classList.add('show'); $('back').onclick=function(){$('wel').classList.remove('show')};
  };
})();
</script>
</body>
</html>
