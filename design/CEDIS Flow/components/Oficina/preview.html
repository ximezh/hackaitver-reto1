<!-- @dsCard group="Web" height=800 width=1250 subtitle="Oficina: CRUD de catálogos e indicadores" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Oficina CRUD</title>
<style>
.bar2{display:flex;gap:10px;align-items:center;padding:14px 16px}
.racks{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:8px}
.racks i{height:18px;border-radius:4px;background:var(--brand-100);position:relative;overflow:hidden}
.racks i b{position:absolute;left:0;right:0;bottom:0;background:var(--brand-600)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.acts button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-muted)}
.acts button.del:hover{color:var(--danger);border-color:var(--danger)}
.acts button.ed:hover{color:var(--brand-600);border-color:var(--brand-600)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
tr.flash td{animation:fl 1.4s}
@keyframes fl{0%{background:var(--brand-50)}100%{background:transparent}}
</style></head>
<body>
<div class="stage"><div class="web" id="scr" style="position:relative">
  <aside class="side"><div class="brand"><span class="logo" id="lg"></span>CEDIS Flow</div><nav class="nav" id="nav"></nav>
    <div style="margin-top:auto" class="card pad"><div class="row"><div class="avatar">AD</div><div class="grow"><div class="t-data" style="font-size:13px">Ana Domínguez</div><div class="t-cap">Oficina · Admin</div></div></div></div></aside>
  <section class="main"><header class="top"><h1 id="ttl"></h1><span class="chip mute" id="dt"></span><button class="iconbtn" id="bell" aria-label="Avisos"></button></header>
    <div class="content">
      <div class="kpis" id="kpis"></div>
      <div class="card" style="overflow:hidden"><div class="bar2"><label class="field sm" style="width:300px"><span id="is"></span><input id="q" placeholder="Buscar"></label><span class="t-cap grow" id="cnt"></span><button class="btn primary sm" id="new"></button></div><div id="tb"></div></div>
    </div></section>
  <div class="modal" id="md"><div class="body" id="mdb"></div></div>
</div></div>
<script>
(function(){
  var C=window.Cedis,$=function(i){return document.getElementById(i)};
  $('lg').innerHTML=C.ic('cube',20,2.2); $('is').innerHTML=C.ic('search',18); $('bell').innerHTML=C.ic('bell'); $('dt').innerHTML=C.ic('calendar',14,2)+'Mié 25 nov';
  $('new').innerHTML=C.ic('plus',16)+'Nuevo';
  var E={
    productos:{t:'Productos',i:'box',cols:[['sku','SKU'],['nombre','Producto'],['porBulto','Piezas/bulto'],['kg','Peso bulto (kg)'],['m3','Volumen (m³)']],rows:C.productos.map(function(p){return {sku:p.sku,nombre:p.nombre,porBulto:p.porBulto,kg:p.kg,m3:p.m3,_img:p.img}})},
    proveedores:{t:'Proveedores',i:'factory',cols:[['rfc','RFC'],['nombre','Proveedor'],['contacto','Contacto'],['tel','Teléfono'],['estado','Estado']],rows:[{rfc:'PGO090312AB1',nombre:'Papelera del Golfo',contacto:'Laura Pérez',tel:'229 555 0142',estado:'Activo'},{rfc:'DAT110820KL3',nombre:'Distribuidora Atlas',contacto:'Hugo Ríos',tel:'228 555 0193',estado:'Activo'},{rfc:'GEM150101QW8',nombre:'Grupo Escolar MX',contacto:'Sofía Lara',tel:'55 5555 0110',estado:'Activo'},{rfc:'USU180507ZX2',nombre:'Útiles del Sureste',contacto:'Iván Cruz',tel:'999 555 0177',estado:'Suspendido'}]},
    sucursales:{t:'Sucursales',i:'store',cols:[['clave','Clave'],['nombre','Sucursal'],['rack','Rack'],['ciudad','Ciudad'],['estado','Estado']],rows:C.sucursales.map(function(s,i){return {clave:s.slice(5,7),nombre:s,rack:'R-'+s.slice(5,7),ciudad:s.slice(8),estado:'Activo'}})},
    usuarios:{t:'Usuarios',i:'users',cols:[['usuario','Usuario'],['nombre','Nombre'],['rol','Rol'],['canal','Canal'],['estado','Estado']],rows:[{usuario:'caseta.jlopez',nombre:'Jorge López',rol:'Caseta',canal:'Android',estado:'Activo'},{usuario:'desem.mruiz',nombre:'María Ruiz',rol:'Sup. desembarque',canal:'Android',estado:'Activo'},{usuario:'embar.acruz',nombre:'Alan Cruz',rol:'Sup. embarque',canal:'Android',estado:'Activo'},{usuario:'suc07',nombre:'Suc. 07 Boca del Río',rol:'Sucursal',canal:'Web',estado:'Activo'},{usuario:'pgolfo',nombre:'Papelera del Golfo',rol:'Proveedor',canal:'Web',estado:'Activo'}]}
  };
  var cur='productos', q='', flash=-1;
  function nav(){ $('nav').innerHTML=Object.keys(E).map(function(k){return '<button class="'+(cur===k?'on':'')+'" data-k="'+k+'">'+C.ic(E[k].i)+E[k].t+'<span class="t-cap" style="margin-left:auto">'+E[k].rows.length+'</span></button>'}).join(''); $('ttl').textContent=E[cur].t; }
  $('nav').onclick=function(e){var b=e.target.closest('button');if(!b)return;cur=b.dataset.k;q='';$('q').value='';render();};
  function kpis(){ var occ=[28,31,19,24,32,12,27,30,22,26,29,17,31,25,20,23,30,28,14,26,32,24,21,27,19,30,25,22,29,18,26,31];
    $('kpis').innerHTML=[['truck','Camiones recibidos hoy','23 / 35'],['send','Embarques hoy','14 / 20'],['check','Recepciones sin error','96%']].map(function(k){return '<div class="card kpi"><span class="ic">'+C.ic(k[0],22)+'</span><div><div class="t-cap">'+k[1]+'</div><div class="t-data" style="font-size:17px">'+k[2]+'</div></div></div>'}).join('')+
      '<div class="card kpi" style="display:block"><div class="row" style="justify-content:space-between"><span class="t-cap">Ocupación de racks</span><b style="font-size:13px">'+Math.round(occ.reduce(function(a,b){return a+b})/(32*32)*100)+'%</b></div><div class="racks">'+occ.slice(0,32).map(function(o){return '<i title="'+o+'/32"><b style="height:'+(o/32*100)+'%"></b></i>'}).join('')+'</div></div>';
    document.querySelector('.racks').style.gridTemplateColumns='repeat(16,1fr)'; }
  function table(){ var e=E[cur], rows=e.rows.map(function(r,i){return [r,i]}).filter(function(x){return !q||JSON.stringify(x[0]).toLowerCase().indexOf(q)>=0});
    $('cnt').textContent=rows.length+' registros';
    $('tb').innerHTML='<table class="tbl"><tr>'+e.cols.map(function(c){return '<th>'+c[1]+'</th>'}).join('')+'<th></th></tr>'+rows.map(function(x){var r=x[0];return '<tr class="'+(x[1]===flash?'flash':'')+'">'+e.cols.map(function(c,j){var v=r[c[0]];
        if(c[0]==='estado')v='<span class="chip '+(v==='Activo'?'ok':'warn')+'"><span class="dot"></span>'+v+'</span>';
        else if(j===1&&cur==='productos')v='<div class="row" style="gap:10px"><span class="thumb" style="width:34px;height:34px"><img src="'+C.A[r._img||'bulto']+'" alt=""></span>'+v+'</div>';
        else if(j===0)v='<b>'+v+'</b>';
        return '<td>'+v+'</td>'}).join('')+'<td><div class="acts"><button class="ed" data-i="'+x[1]+'" aria-label="Editar">'+C.ic('edit',16)+'</button><button class="del" data-i="'+x[1]+'" aria-label="Eliminar">'+C.ic('trash',16)+'</button></div></td></tr>'}).join('')+'</table>';
    flash=-1; }
  function form(i){ var e=E[cur], r=i==null?{}:e.rows[i];
    $('mdb').innerHTML='<div class="row"><span class="kpi" style="padding:0"><span class="ic" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-50);color:var(--brand-700)">'+C.ic(i==null?'plus':'edit',22)+'</span></span><div class="grow"><div class="t-title">'+(i==null?'Nuevo':'Editar')+'</div><div class="t-cap">'+e.t+'</div></div><button class="iconbtn ghost" id="cx" aria-label="Cerrar">'+C.ic('x')+'</button></div>'+
      '<div class="grid2">'+e.cols.map(function(c){return '<div><span class="lbl">'+c[1]+'</span><label class="field sm"><input data-f="'+c[0]+'" value="'+(r[c[0]]!=null?r[c[0]]:'')+'"></label></div>'}).join('')+'</div>'+
      '<div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn line" id="cn">Cancelar</button><button class="btn primary" id="sv">'+C.ic('check',18)+'Guardar</button></div>';
    $('md').classList.add('open'); $('cx').onclick=$('cn').onclick=close;
    $('sv').onclick=function(){ var o=i==null?{}:e.rows[i]; [].forEach.call($('mdb').querySelectorAll('input'),function(inp){o[inp.dataset.f]=inp.value});
      if(!o[e.cols[0][0]]){C.toast($('scr'),'Completa '+e.cols[0][1],'alert');return;}
      if(i==null){ if(cur==='productos')o._img='bulto'; e.rows.unshift(o); flash=0; } else flash=i;
      close(); render(); C.toast($('scr'),i==null?'Registro creado':'Cambios guardados','check'); };
  }
  function del(i){ var e=E[cur], r=e.rows[i];
    $('mdb').innerHTML='<div style="text-align:center"><div style="width:64px;height:64px;border-radius:20px;background:var(--danger-50);color:var(--danger);display:grid;place-items:center;margin:0 auto 12px">'+C.ic('trash',30)+'</div><div class="t-title">¿Eliminar?</div><div class="muted" style="margin:4px 0 18px">'+r[e.cols[1][0]]+'</div><div class="row" style="justify-content:center"><button class="btn line" id="cn">Cancelar</button><button class="btn" style="background:var(--danger);color:#fff" id="dl">'+C.ic('trash',18)+'Eliminar</button></div></div>';
    $('md').classList.add('open'); $('cn').onclick=close; $('dl').onclick=function(){e.rows.splice(i,1);close();render();C.toast($('scr'),'Registro eliminado','check');}; }
  function close(){$('md').classList.remove('open')}
  $('md').onclick=function(ev){if(ev.target===this)close()};
  $('tb').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;if(b.classList.contains('ed'))form(+b.dataset.i);else del(+b.dataset.i);};
  $('new').onclick=function(){form(null)}; $('q').oninput=function(){q=this.value.toLowerCase();table();};
  function render(){nav();table();}
  kpis(); render();
})();
</script>
</body>
</html>
