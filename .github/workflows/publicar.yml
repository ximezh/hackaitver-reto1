# Publica las imágenes de front y back en GHCR cuando el CI pasa en `dev` o `main` (DO-13).
# La instancia las toma por su etiqueta `sha-<commit>` (infra/actualizar.sh): si el CI falla,
# no se publica nada y el entorno sigue con la versión anterior.
name: Publicar

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read
  packages: write

jobs:
  imagenes:
    name: Imágenes en GHCR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        parte: [back, front]
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      RAMA: ${{ github.event.workflow_run.head_branch }}
      IMAGEN: ghcr.io/ximezh/hackaitver-reto1-${{ matrix.parte }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Iniciar sesión en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir y publicar
        run: |
          entorno=$([ "$RAMA" = main ] && echo produccion || echo staging)
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision="$SHA" \
            -t "$IMAGEN:sha-$SHA" -t "$IMAGEN:$entorno" ${{ matrix.parte }}/
          docker push "$IMAGEN:sha-$SHA"
          docker push "$IMAGEN:$entorno"
          echo "Publicada $IMAGEN:sha-$SHA ($entorno)" >> "$GITHUB_STEP_SUMMARY"
