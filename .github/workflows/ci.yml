# Integración continua de front y back. En los push a `dev` y `main`, si todo pasa, publica las
# imágenes que toma la instancia (DO-13): staging sigue a `dev` y producción a `main`.
# Cada parte corre solo si cambió algo en su carpeta. El job `ci` siempre corre y resume
# el resultado: es el único check que se marca como obligatorio en `dev` y `main`.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.filtro.outputs.front }}
      back: ${{ steps.filtro.outputs.back }}
      tools: ${{ steps.filtro.outputs.tools }}
      github: ${{ steps.filtro.outputs.github }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'
            back:
              - 'back/**'
              - '.github/workflows/ci.yml'
            tools:
              - 'tools/**'
              - 'design/**'
              - '.github/workflows/ci.yml'
            github:
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  front:
    name: Front · lint, pruebas y build
    needs: cambios
    if: needs.cambios.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      # Sin --fix: en CI el lint solo revisa, no corrige.
      - name: Oxlint
        run: npx oxlint .
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check src/
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
      - name: Imagen de contenedor
        run: docker build -t reto1-front:ci .

  back:
    name: Back · Ruff y pytest
    needs: cambios
    if: needs.cambios.outputs.back == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reto1
          POSTGRES_PASSWORD: reto1
          POSTGRES_DB: reto1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reto1 -d reto1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://reto1:reto1@localhost:5432/reto1
      TEST_DATABASE_URL: postgresql://reto1:reto1@localhost:5432/reto1_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - name: Crear la base de pruebas
        run: psql postgresql://reto1:reto1@localhost:5432/reto1 -c "CREATE DATABASE reto1_test"
      - run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest
      - name: Imagen de contenedor
        run: docker build -t reto1-back:ci .

  tools:
    name: Tools · visor del prototipo
    needs: cambios
    if: needs.cambios.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pruebas
        working-directory: tools/prototipo
        run: npm test

  github:
    name: GitHub · revisor de convenciones
    needs: cambios
    if: needs.cambios.outputs.github == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pruebas
        working-directory: .github/scripts
        run: python -m unittest -v test_convenciones.py

  ci:
    name: ci
    needs: [cambios, front, back, tools, github]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        run: |
          echo "front: ${{ needs.front.result }} · back: ${{ needs.back.result }} · tools: ${{ needs.tools.result }} · github: ${{ needs.github.result }}"
          for resultado in "${{ needs.cambios.result }}" "${{ needs.front.result }}" "${{ needs.back.result }}" "${{ needs.tools.result }}" "${{ needs.github.result }}"; do
            if [ "$resultado" != "success" ] && [ "$resultado" != "skipped" ]; then
              echo "Un job falló o se canceló: $resultado"
              exit 1
            fi
          done

  publicar:
    name: Publicar imágenes
    needs: ci
    if: github.event_name == 'push' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        parte: [back, front]
    env:
      IMAGEN: ghcr.io/ximezh/hackaitver-reto1-${{ matrix.parte }}
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar sesión en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # La instancia busca la etiqueta sha-<commit> (infra/actualizar.sh).
      - name: Construir y publicar
        run: |
          entorno=$([ "${{ github.ref_name }}" = main ] && echo produccion || echo staging)
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGEN:sha-${{ github.sha }}" -t "$IMAGEN:$entorno" ${{ matrix.parte }}/
          docker push "$IMAGEN:sha-${{ github.sha }}"
          docker push "$IMAGEN:$entorno"
          echo "Publicada $IMAGEN:sha-${{ github.sha }} ($entorno)" >> "$GITHUB_STEP_SUMMARY"
